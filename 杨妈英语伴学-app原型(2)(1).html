<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD23F">
<title>杨妈英语伴学 · 产品原型</title>
<style>:root{
  --y:#FFD23F; --y2:#FFE680; --y3:#FFF4C4; --y4:#FFFAE6; --y-ink:#3A2C00; --amber:#A86F00;
  --ink:#22201C; --ink2:#6A655D; --ink3:#A8A298; --line:#EFEDE8;
  --bg:#F7F6F2; --card:#FFFFFF;
  --green:#2FB273; --green-l:#E4F7EC; --red:#F0566B; --red-l:#FFE8EC;
  --blue:#3D8FE0; --blue-l:#E6F2FF; --pink-l:#FFEAF0; --purple-l:#F0EBFF; --teal-l:#E2F7F4;
  --r:20px; --sh:0 1px 2px rgba(0,0,0,.03),0 4px 14px rgba(60,40,0,.05);
  --sh2:0 10px 30px rgba(120,90,0,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:-apple-system,"PingFang SC","SF Pro Text","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;color:var(--ink);background:#EEEBE4;font-size:15px;line-height:1.5;overflow:hidden;}
button,input{font:inherit;color:inherit;border:0;background:none;outline:0;}
button{cursor:pointer;}
img{display:block;max-width:100%;}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.qi{flex:none;display:block;}

/* ---------- 预览外壳：桌面端显示手机框 + 页面导航 ---------- */
.shell{height:100%;display:flex;align-items:center;justify-content:center;gap:40px;}
.side{width:280px;height:844px;background:#fff;border-radius:24px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;}
.side-h{padding:20px 20px 12px;border-bottom:1px solid var(--line);}
.side-h b{display:block;font-size:17px;}
.side-h span{font-size:12px;color:var(--ink3);}
.side-b{flex:1;overflow-y:auto;padding:8px 10px 16px;}
.side-g{font-size:12px;font-weight:700;color:var(--ink3);padding:14px 10px 6px;}
.side-i{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--ink2);}
.side-i:hover{background:var(--bg);}
.side-i.on{background:var(--y3);color:var(--ink);font-weight:700;}
.side-i em{font-style:normal;font-size:11px;color:var(--ink3);margin-left:auto;}
.device{position:relative;width:390px;height:844px;border-radius:44px;background:var(--bg);overflow:hidden;
  box-shadow:0 0 0 10px #1E1C19,0 30px 60px rgba(0,0,0,.25);}
.drawer-btn{display:none;}
@media (max-width:760px){
  body{background:var(--bg);}
  .shell{display:block;height:100%;}
  .side{display:none;position:fixed;inset:0;width:auto;height:auto;border-radius:0;z-index:50;}
  .side.open{display:flex;}
  .device{width:100%;height:100%;border-radius:0;box-shadow:none;}
  .drawer-btn{display:grid;place-items:center;position:fixed;right:12px;bottom:96px;z-index:40;width:40px;height:40px;border-radius:50%;
    background:rgba(34,32,28,.55);color:#fff;}
  .side-close{display:block !important;}
}
.side-close{display:none;position:absolute;right:16px;top:18px;}

/* ---------- App 框架 ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;}
.host{position:relative;flex:1;min-height:0;}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);}
.scr.in{animation:slideIn .28s cubic-bezier(.2,.7,.3,1) both;}
.scr.fade{animation:fadeIn .2s ease both;}
.scr.out{animation:slideOut .25s ease both;}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideOut{to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;scrollbar-width:none;}
.body::-webkit-scrollbar{display:none;}
.foot{flex:none;padding:12px 16px 18px;background:#fff;box-shadow:0 -1px 0 var(--line);display:flex;gap:10px;}
.foot .btn{flex:1;}

/* 一级页黄色头部 */
.top{flex:none;padding:18px 20px 10px;background:var(--y);}
.top h1{font-size:26px;font-weight:800;letter-spacing:.5px;line-height:1.2;}
.top p{font-size:13px;color:#6B5714;margin-top:2px;}
.top + .body{background:linear-gradient(180deg,var(--y) 0,var(--y2) 60px,var(--bg) 170px) local,var(--bg);padding-top:8px;}
/* 二级页导航栏 */
.nav{flex:none;display:flex;align-items:center;gap:8px;height:54px;padding:0 12px;background:var(--bg);position:relative;}
.nav .back{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sh);}
.nav .back .ico{width:20px;height:20px;}
.nav h2{position:absolute;left:60px;right:60px;text-align:center;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
.nav .right{margin-left:auto;}

/* 底部导航 */
.tabbar{flex:none;display:flex;background:#fff;padding:6px 8px 14px;box-shadow:0 -1px 0 var(--line);}
.tabbar.hide{display:none;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--ink3);font-weight:600;padding-top:2px;}
.tab .qi{filter:grayscale(1);opacity:.45;transition:transform .2s;}
.tab.on{color:var(--ink);}
.tab.on .qi{filter:none;opacity:1;transform:translateY(-2px) scale(1.08);}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px;}
.sec b{font-size:17px;font-weight:800;}
.sec button{font-size:13px;color:var(--ink3);display:flex;align-items:center;}
.sec .ico{width:14px;height:14px;}
.muted{color:var(--ink3);font-size:13px;}
.small{font-size:13px;color:var(--ink2);}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 18px;border-radius:999px;
  background:var(--y);color:var(--y-ink);font-weight:800;font-size:16px;letter-spacing:.5px;transition:transform .12s,background .12s;width:100%;}
.btn:active{transform:scale(.97);background:#F5C51F;}
.btn[disabled]{background:#ECEAE4;color:#B5B0A6;}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);}
.btn.soft{background:var(--y3);color:#6E5200;}
.btn.sm{min-height:36px;font-size:13px;padding:0 14px;width:auto;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:99px;background:#fff;font-size:13px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);}
.chip.on{background:var(--y);color:var(--y-ink);box-shadow:none;font-weight:700;}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--y3);color:#7A5A00;}
.tag.g{background:var(--green-l);color:#1E8A55;} .tag.gray{background:#F1F0EC;color:var(--ink3);} .tag.b{background:var(--blue-l);color:#2A6FB8;}
.seg{display:flex;background:rgba(255,255,255,.7);border-radius:99px;padding:4px;gap:4px;}
.seg button{flex:1;height:36px;border-radius:99px;font-size:14px;font-weight:700;color:var(--ink2);}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh);}
.pbar{height:8px;border-radius:99px;background:#F0EEE8;overflow:hidden;}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--y);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);}
.stats div{text-align:center;position:relative;}
.stats div + div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line);}
.stats b{display:block;font-size:22px;font-weight:800;line-height:1.2;}
.stats span{font-size:12px;color:var(--ink3);}
/* 列表项 */
.list{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;}
.li + .li{border-top:1px solid var(--line);}
.li .t{display:block;font-size:15px;font-weight:700;}
.li .s{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px;}
.li .grow{flex:1;min-width:0;}
.li .chev{color:#CFCAC0;width:18px;height:18px;}
.grow{flex:1;min-width:0;}
.row{display:flex;align-items:center;gap:10px;}
.between{justify-content:space-between;}
/* 图标宫格 */
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px 8px 16px;}
.icons.c3{grid-template-columns:repeat(3,1fr);}
.icons button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink);font-weight:600;}
.icons button span{font-size:11px;color:var(--ink3);font-weight:400;margin-top:-4px;}
.icons button:active .qi{transform:scale(.9);}
/* 杨妈小提示 */
.tip{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:var(--sh);font-size:13.5px;color:var(--ink2);}
.tip img{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:50% 6%;background:var(--y3);flex:none;}
.tip b{color:var(--ink);}

/* toast */
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(34,32,28,.88);color:#fff;font-size:14px;
  padding:10px 18px;border-radius:99px;z-index:60;white-space:nowrap;animation:fadeIn .2s;}

/* ---------- 登录 / 引导 ---------- */
.auth{background:#fff;}
.auth .body{display:flex;flex-direction:column;padding:0 28px;}
.auth-c{flex:1;display:flex;flex-direction:column;justify-content:center;}
.brand{text-align:center;margin-bottom:36px;}
.brand img{width:92px;margin:0 auto;}
.brand b{display:block;font-size:26px;font-weight:800;margin-top:10px;letter-spacing:1px;}
.brand span{font-size:13px;color:var(--ink3);}
.phone{display:flex;align-items:center;height:54px;border-radius:16px;background:var(--bg);padding:0 16px;}
.phone b{padding-right:12px;margin-right:12px;border-right:1.5px solid var(--line);}
.phone input{flex:1;min-width:0;font-size:17px;letter-spacing:1px;}
.codebox{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.codebox input{position:absolute;inset:0;opacity:0;}
.codebox span{height:54px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:22px;font-weight:800;}
.codebox span.cur{box-shadow:inset 0 0 0 2px var(--y);}
.agree{display:flex;justify-content:center;gap:6px;font-size:12px;color:var(--ink3);padding:14px 0 22px;}
.agree input{accent-color:var(--y);}
.link{font-size:13px;font-weight:600;color:var(--ink);}
.link[disabled]{color:var(--ink3);font-weight:400;}
.steps3{display:flex;gap:6px;}
.steps3 i{width:22px;height:6px;border-radius:99px;background:#E7E4DC;}
.steps3 i.on{background:var(--y);}
.ob-q{font-size:26px;font-weight:800;margin:20px 4px 6px;}
.ob-s{font-size:14px;color:var(--ink3);margin:0 4px 30px;}
.opt-big{display:block;width:100%;height:60px;border-radius:16px;background:#fff;box-shadow:var(--sh);font-size:17px;font-weight:700;margin-bottom:12px;}
.opt-big.on{background:var(--y);}
.wheel{position:relative;height:240px;}
.wheel-hl{position:absolute;left:0;right:0;top:96px;height:48px;border-radius:14px;background:var(--y3);}
.wheel-l{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);}
.wheel-l::-webkit-scrollbar{display:none;}
.wheel-pad{height:96px;}
.wheel-it{height:48px;line-height:48px;text-align:center;scroll-snap-align:start;font-size:16px;color:var(--ink3);cursor:pointer;transition:all .15s;}
.wheel-it.on{font-size:20px;font-weight:800;color:var(--ink);}
.pref{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:10px;box-shadow:inset 0 0 0 2px transparent,var(--sh);}
.pref b{display:block;font-size:16px;} .pref span{font-size:12.5px;color:var(--ink3);}
.pref .ck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:transparent;}
.pref .ck .ico{width:14px;height:14px;stroke-width:3;}
.pref.on{box-shadow:inset 0 0 0 2px var(--y),var(--sh);background:var(--y4);}
.pref.on .ck{background:var(--y);box-shadow:none;color:var(--y-ink);}

/* ---------- 学习首页 ---------- */
.home-top{flex:none;display:flex;align-items:center;gap:12px;padding:16px 20px 14px;background:var(--y);}
.home-top .av{width:46px;height:46px;border-radius:50%;background:#fff;overflow:hidden;display:grid;place-items:center;}
.home-top .av img{width:42px;}
.home-top small{display:block;font-size:12px;color:#6B5714;}
.home-top b{font-size:19px;font-weight:800;}
.pill{display:inline-flex;align-items:center;gap:2px;padding:4px 12px 4px 6px;border-radius:99px;background:rgba(255,255,255,.75);font-size:12px;color:var(--ink2);}
.pill b{font-size:15px;color:var(--ink);margin:0 2px;}
.home-top + .body{background:linear-gradient(180deg,var(--y) 0,var(--y2) 70px,var(--bg) 200px) local,var(--bg);}
.today{position:relative;background:#fff;border-radius:26px;box-shadow:var(--sh2);padding:18px 16px 16px;overflow:hidden;}
.corner{position:absolute;right:0;top:0;background:var(--y2);color:#5A4500;font-size:12px;font-weight:700;padding:6px 16px 6px 18px;border-bottom-left-radius:18px;}
.today .k{font-size:12px;color:var(--ink3);font-weight:600;}
.today h3{font-size:23px;font-weight:800;line-height:1.25;margin-top:2px;}
.cover{position:relative;height:150px;border-radius:18px;margin-top:12px;overflow:hidden;display:flex;align-items:flex-end;justify-content:flex-end;}
.cover img{height:128px;margin:0 18px 6px 0;}
.cover .ct{position:absolute;left:16px;top:14px;}
.cover .ct b{display:block;font-size:18px;}
.cover .ct span{display:inline-block;margin-top:6px;font-size:12px;background:rgba(255,255,255,.85);padding:2px 10px;border-radius:99px;color:var(--ink2);}
.cover .play{position:absolute;left:16px;bottom:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;}
.cover .play .ico{width:18px;height:18px;fill:var(--ink);stroke:none;margin-left:2px;}
.flow{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;}
.flow div{text-align:center;position:relative;}
.flow div + div::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--line);}
.flow b{display:flex;align-items:center;justify-content:center;gap:3px;font-size:15px;color:var(--ink3);}
.flow b .ico{width:15px;height:15px;stroke-width:3;}
.flow span{font-size:11.5px;color:var(--ink3);}
.flow .cur b{color:var(--ink);} .flow .cur span{color:var(--amber);font-weight:700;}
.flow .done b{color:var(--green);}
.btn2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:14px;}
.forms{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 6px 12px;margin-top:14px;}
.forms button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--ink2);}
.forms button .qw{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px transparent;}
.forms button.on{color:var(--ink);font-weight:800;}
.forms button.on .qw{box-shadow:inset 0 0 0 2.5px var(--y);background:var(--y4);}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.duo button{display:flex;align-items:center;gap:8px;padding:14px 12px;border-radius:var(--r);text-align:left;}
.duo b{display:block;font-size:15px;} .duo span{font-size:11.5px;color:var(--ink2);}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none;}
.hscroll::-webkit-scrollbar{display:none;}
.rc{flex:none;width:118px;text-align:left;}
.rc .c{height:118px;border-radius:18px;display:grid;place-items:center;position:relative;}
.rc .c img{height:84px;}
.rc .c em{position:absolute;left:8px;right:8px;bottom:8px;font-style:normal;font-size:11px;font-weight:700;color:rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc b{display:block;font-size:13.5px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc span{font-size:11.5px;color:var(--ink3);}

/* ---------- 课程 ---------- */
.course{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:18px 16px 16px;margin-bottom:12px;}
.course h3{font-size:19px;font-weight:800;}
.track{display:flex;margin-top:16px;}
.tn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11.5px;color:var(--ink3);}
.tn + .tn::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:2px;background:#ECEAE4;}
.tn.done + .tn::before{background:var(--ink);}
.tn i{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;background:#F1F0EC;}
.tn i .ico{width:14px;height:14px;stroke-width:3;}
.tn.now{color:var(--ink);font-weight:700;} .tn.now i{background:var(--y);}
.tn.done i{background:var(--ink);color:#fff;}
.stage{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;}
.stage-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;}
.stage-h b{font-size:16px;}
.lesson-i{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;}
.lesson-i .n{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--y3);font-weight:800;font-size:13px;flex:none;}
.lesson-i.lock .n{background:#F1F0EC;color:var(--ink3);}
.lesson-i.done .n{background:var(--green-l);color:var(--green);}
.lesson-i .n .ico{width:16px;height:16px;stroke-width:2.6;}
.lesson-i b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lesson-i span{font-size:12px;color:var(--ink3);}
.ep{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:18px;box-shadow:var(--sh);margin-bottom:10px;width:100%;text-align:left;}
.ep .th{width:76px;height:60px;border-radius:14px;display:grid;place-items:center;flex:none;}
.ep .th img{height:48px;}
.ep b{display:block;font-size:14.5px;}
.ep span{font-size:12px;color:var(--ink3);}

/* ---------- 学习 / 播放 ---------- */
.player{position:relative;height:210px;border-radius:22px;overflow:hidden;display:grid;place-items:center;margin-top:4px;}
.player img{height:150px;}
.player .pb{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.12);}
.player .pb .ico{width:26px;height:26px;fill:var(--ink);stroke:none;margin-left:3px;}
.player .sub{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(34,32,28,.72);color:#fff;font-size:14px;font-weight:600;border-radius:12px;padding:8px 12px;text-align:center;}
.player .bar{position:absolute;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.08);}
.player .bar i{display:block;height:100%;width:0;background:var(--y);transition:width .1s linear;}
.segs{display:flex;gap:6px;margin:14px 2px 0;}
.segs i{flex:1;height:6px;border-radius:99px;background:#E7E4DC;}
.segs i.on{background:var(--y);} .segs i.done{background:var(--ink);}

/* ---------- 答题 ---------- */
.qtop{display:flex;align-items:center;gap:12px;padding:0 4px;}
.qtop .pbar{flex:1;}
.qtop span{font-size:13px;font-weight:700;color:var(--ink2);}
.qcard{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:22px 18px;margin-top:16px;text-align:center;}
.qcard .kind{font-size:12px;font-weight:700;color:var(--amber);background:var(--y4);padding:3px 10px;border-radius:99px;display:inline-block;}
.qcard .word{font-size:38px;font-weight:800;letter-spacing:1px;margin-top:10px;}
.qcard .qtext{font-size:18px;font-weight:700;margin-top:12px;line-height:1.5;}
.qcard .ph{font-size:13px;color:var(--ink3);}
.spk{width:76px;height:76px;border-radius:50%;background:var(--y);display:grid;place-items:center;margin:14px auto 4px;}
.spk .ico{width:34px;height:34px;}
.spk.sm{width:40px;height:40px;background:var(--y3);margin:8px auto 0;}
.spk.sm .ico{width:20px;height:20px;}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:inset 0 0 0 2px transparent,var(--sh);font-size:16px;font-weight:600;transition:all .15s;}
.opt i{width:28px;height:28px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:var(--ink2);flex:none;}
.opt.ok{box-shadow:inset 0 0 0 2px var(--green);background:var(--green-l);}
.opt.ok i{background:var(--green);color:#fff;}
.opt.bad{box-shadow:inset 0 0 0 2px var(--red);background:var(--red-l);}
.opt.bad i{background:var(--red);color:#fff;}
.spell{width:100%;height:58px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);text-align:center;font-size:24px;font-weight:800;letter-spacing:2px;margin-top:16px;}
.spell:focus{box-shadow:inset 0 0 0 2px var(--y);}
.mic{width:88px;height:88px;border-radius:50%;background:var(--y);display:grid;place-items:center;margin:26px auto 10px;box-shadow:0 0 0 10px var(--y4);}
.mic .ico{width:36px;height:36px;}
.mic.rec{animation:pulse 1s infinite;}
@keyframes pulse{50%{box-shadow:0 0 0 18px var(--y3);}}
.fb{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;margin-top:14px;font-size:14px;font-weight:700;text-align:left;}
.fb.ok{background:var(--green-l);color:#1E8A55;} .fb.bad{background:var(--red-l);color:#C23A50;}
.fb .ico{width:20px;height:20px;stroke-width:2.6;}

/* ---------- 结果页 ---------- */
.res{text-align:center;padding-top:10px;}
.res img{height:130px;margin:0 auto;}
.res h2{font-size:26px;font-weight:800;margin-top:10px;}
.res p{font-size:14px;color:var(--ink2);margin-top:4px;}
.starsrow{display:flex;justify-content:center;gap:6px;margin-top:12px;}
.starsrow .qi{animation:pop .4s both;}
.starsrow .qi.off{filter:grayscale(1);opacity:.25;}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.level{font-size:54px;font-weight:900;line-height:1;margin-top:4px;}
.abil{margin-top:12px;}
.abil .row{margin-top:10px;font-size:13px;}
.abil .row span{width:64px;color:var(--ink2);}
.abil .row em{font-style:normal;width:36px;text-align:right;font-weight:700;}
.abil .pbar{flex:1;}

/* ---------- 复习 ---------- */
.rv-today{background:#fff;border-radius:26px;box-shadow:var(--sh2);padding:18px 16px 16px;}
.rv-today h3{font-size:21px;font-weight:800;}
.rv-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.rv-nums div{background:var(--bg);border-radius:14px;padding:10px 0;text-align:center;}
.rv-nums b{display:block;font-size:20px;font-weight:800;}
.rv-nums span{font-size:11.5px;color:var(--ink3);}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:var(--r);text-align:left;position:relative;}
.mode b{font-size:16px;} .mode span{font-size:12px;color:var(--ink2);}
.mode .cnt{position:absolute;right:12px;top:12px;font-size:11px;font-weight:800;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:99px;}
.word-i{display:flex;align-items:center;gap:12px;padding:12px 16px;}
.word-i + .word-i{border-top:1px solid var(--line);}
.word-i b{font-size:16px;color:var(--ink);} .word-i .grow{color:var(--ink);} .word-i .grow span{font-size:12.5px;color:var(--ink3);}
.seglist .li{padding:12px 16px;} .seglist .n{width:28px;height:28px;border-radius:9px;background:#F1F0EC;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;color:var(--ink3);} .seglist .on .n{background:var(--y);color:var(--y-ink);} .seglist .done .n{background:var(--green-l);color:var(--green);} .seglist .n .ico{width:14px;height:14px;stroke-width:3;}
.word-i button{width:34px;height:34px;border-radius:50%;background:var(--y3);display:grid;place-items:center;margin-left:auto;}
.word-i button .ico{width:17px;height:17px;}
.week{display:flex;justify-content:space-between;margin-top:12px;}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);}
.week i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#F1F0EC;font-style:normal;}
.week i.on{background:var(--y);}
.week i .ico{width:14px;height:14px;stroke-width:3;}

/* ---------- 我的 ---------- */
.me-top{flex:none;background:var(--y);padding:22px 20px 12px;}
.me-top .row{gap:14px;}
.me-top .av{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.6);}
.me-top .av img{width:58px;}
.me-top b{font-size:21px;font-weight:800;}
.me-top small{display:block;font-size:12.5px;color:#6B5714;}
.me-top .vip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;background:#2B2622;color:#FFD86B;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:3px;}
.me-top + .body{background:linear-gradient(180deg,var(--y) 0,var(--y2) 50px,var(--bg) 150px) local,var(--bg);padding-top:6px;}
.vipcard{display:flex;align-items:center;gap:12px;background:linear-gradient(110deg,#2B2622,#4A3F33);color:#FFE6A3;border-radius:var(--r);padding:14px 16px;margin-top:12px;}
.vipcard b{display:block;font-size:15px;} .vipcard span{font-size:12px;color:#CBB98F;}
.vipcard .btn{background:#FFD86B;color:#3A2C00;min-height:34px;font-size:13px;width:auto;padding:0 14px;}
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:14px;padding:0 4px;}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11px;color:var(--ink3);}
.bars i{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:var(--y);}
.bars i.lo{background:#F1EEE4;}
.hl{display:flex;gap:12px;align-items:flex-start;padding:14px 0;}
.hl + .hl{border-top:1px solid var(--line);}
.hl b{display:block;font-size:14.5px;} .hl span{font-size:12.5px;color:var(--ink2);}
.work{display:flex;align-items:center;gap:12px;padding:12px 16px;}
.work + .work{border-top:1px solid var(--line);}
.work .pl{width:40px;height:40px;border-radius:50%;background:var(--y);display:grid;place-items:center;margin-left:auto;flex:none;}
.work .pl .ico{width:16px;height:16px;fill:var(--ink);stroke:none;margin-left:2px;}
.opts-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.item{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px;text-align:left;}
.item .pic{height:96px;border-radius:14px;display:grid;place-items:center;}
.item b{display:block;font-size:14px;margin-top:8px;}
.item .pr{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-weight:800;font-size:14px;}
.sw{width:46px;height:28px;border-radius:99px;background:#E4E1DA;position:relative;flex:none;transition:background .2s;}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.sw.on{background:var(--y);} .sw.on::after{left:21px;}
.chat{display:flex;flex-direction:column;gap:12px;padding-top:6px;}
.bub{max-width:82%;padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.6;}
.bub.ai{background:#fff;box-shadow:var(--sh);border-top-left-radius:6px;align-self:flex-start;}
.bub.me{background:var(--y);border-top-right-radius:6px;align-self:flex-end;}
.chatin{flex:none;display:flex;gap:8px;padding:10px 12px 16px;background:#fff;box-shadow:0 -1px 0 var(--line);}
.chatin input{flex:1;height:44px;border-radius:99px;background:var(--bg);padding:0 16px;font-size:14.5px;}
.chatin .btn{width:auto;min-height:44px;padding:0 18px;font-size:14px;}
.upload{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;border-radius:var(--r);background:#fff;box-shadow:inset 0 0 0 2px #EDE7D3;width:100%;}
.upload.done{box-shadow:inset 0 0 0 2px var(--green);background:var(--green-l);}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:30;}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards;}
@keyframes fall{to{transform:translateY(900px) rotate(540deg);opacity:.2}}
</style></head>

<script>
/* ===== Q 版图标（48×48，自绘）===== */
const QO = '#4A3426';               /* 描边：暖深棕 */
function qface(cx, cy, s){          /* 眼睛 + 腮红 + 微笑 */
  s = s || 1;
  const ex = 4.2 * s, ey = 0;
  return `<ellipse cx="${cx-ex}" cy="${cy}" rx="${1.7*s}" ry="${2.1*s}" fill="${QO}"/>` +
    `<ellipse cx="${cx+ex}" cy="${cy}" rx="${1.7*s}" ry="${2.1*s}" fill="${QO}"/>` +
    `<circle cx="${cx-ex+0.6*s}" cy="${cy-0.8*s}" r="${0.6*s}" fill="#fff"/>` +
    `<circle cx="${cx+ex+0.6*s}" cy="${cy-0.8*s}" r="${0.6*s}" fill="#fff"/>` +
    `<ellipse cx="${cx-ex-2.2*s}" cy="${cy+3*s}" rx="${2*s}" ry="${1.2*s}" fill="#FF8FA3" opacity=".55"/>` +
    `<ellipse cx="${cx+ex+2.2*s}" cy="${cy+3*s}" rx="${2*s}" ry="${1.2*s}" fill="#FF8FA3" opacity=".55"/>` +
    `<path d="M${cx-1.6*s} ${cy+2.4*s} q${1.6*s} ${1.8*s} ${3.2*s} 0" fill="none" stroke="${QO}" stroke-width="${1.4*s}" stroke-linecap="round"/>`;
}
const QS = `stroke="${QO}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
const QICONS = {
  /* —— 底部导航 —— */

/* ---------- 提示 / 撒花 ---------- */
function toast(t){
  const box = $('.device'); const old = $('.toast', box); if(old) old.remove();
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; box.appendChild(d);
  setTimeout(() => d.remove(), 2000);
}
function confetti(){
  const box = $('.device'); const c = document.createElement('div'); c.className = 'confetti';
  const cols = ['#FFD23F','#FF8FAB','#5DB7FF','#5ED39A','#B39CFF'];
  for(let i = 0; i < 40; i++){
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + '%'; p.style.background = cols[i % 5];
    p.style.animationDelay = Math.random() * .5 + 's'; c.appendChild(p);
  }
  box.appendChild(c); setTimeout(() => c.remove(), 2400);
}

/* ---------- 路由 ---------- */
const SCREENS = {};
const TABS = [
  { id:'learn',  name:'学习', icon:'learn'  },
  { id:'course', name:'课程', icon:'course' },
  { id:'review', name:'复习', icon:'review' },
  { id:'me',     name:'我的', icon:'me'     }
];
const stack = [];
const cur = () => stack[stack.length - 1];

function mountScreen(route, params, anim){
  const def = SCREENS[route]; if(!def) return console.warn('no screen', route);
  const el = document.createElement('section');
  el.className = 'scr ' + (anim || '') + ' ' + (def.cls || '');
  el.dataset.route = route;
  el.innerHTML = def.render(params || {});
  $('.host').appendChild(el);
  const item = { route, params: params || {}, el, def };
  stack.push(item);
  el.addEventListener('click', e => {
    if(e.target.closest('[data-back]')) back();
    const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go, g.dataset.p ? JSON.parse(g.dataset.p) : {}); }
    const t = e.target.closest('[data-toast]'); if(t) toast(t.dataset.toast);
  });
  if(def.mount) def.mount(el, item.params);
  syncChrome();
  return item;
}
function go(route, params){
  const prev = cur();
  mountScreen(route, params, 'in');
  if(prev) setTimeout(() => { if(prev.el.parentNode && cur().el !== prev.el) prev.el.style.visibility = 'hidden'; }, 300);
}
function back(){
  if(stack.length < 2) return;
  const top = stack.pop(); const prev = cur();
  prev.el.style.visibility = '';
  if(prev.def.refresh){ prev.el.innerHTML = prev.def.render(prev.params); if(prev.def.mount) prev.def.mount(prev.el, prev.params); }
  top.el.classList.add('out'); setTimeout(() => top.el.remove(), 250);
  syncChrome();
}
function root(route, params){
  $$('.confetti').forEach(c => c.remove());
  stack.forEach(s => s.el.remove()); stack.length = 0;
  mountScreen(route, params, 'fade');
}
function tab(id){ root(id); }
/* 回到某个一级页（清空其上的二级页） */
function home(id){ root(id || 'learn'); }

function syncChrome(){
  const c = cur(); const isRoot = c && TABS.some(t => t.id === c.route) && stack.length === 1;
  const bar = $('.tabbar');
  bar.classList.toggle('hide', !isRoot);
  if(isRoot) bar.innerHTML = TABS.map(t =>
    '<button class="tab' + (t.id === c.route ? ' on' : '') + '" data-tab="' + t.id + '">' + qi(t.icon, 30) + t.name + '</button>').join('');
  $$('.side-i').forEach(b => b.classList.toggle('on', c && b.dataset.r === c.route));
}

      (o.right ? '<span class="right">' + o.right + '</span>' : '') + '</header>';
  return head + '<div class="body">' + (o.body || '') + '</div>' + (o.foot ? '<div class="foot">' + o.foot + '</div>' : '');
}

const tip = (html, img) => '<div class="tip"><img src="' + IMG(img || 'ym1') + '" alt="">' + '<span>' + html + '</span></div>';

      if(playing) return; playing = true; pb.style.display = 'none'; sub.textContent = L.segs[i].en; say(L.segs[i].en);
      let w = 0; const t = setInterval(() => { w += 4; bar.style.width = w + '%'; if(w >= 100){ clearInterval(t); playing = false; pb.style.display = ''; showQ(); next.textContent = '先答一下小问题'; } }, 90);
    };

    next.onclick = () => {
      if(i < L.segs.length - 1){ i++; delete qbox.dataset.done; qbox.innerHTML = ''; qbox.dataset.list = 1; bar.style.width = 0; next.disabled = true; next.textContent = '先看完这一段'; sub.textContent = '第 ' + (i + 1) + ' 段 · 点播放继续'; paintSegs(); return; }

      else if(p.src === 'course'){ save(); replace('quiz', { m:'after', k:p.k }); }
      else { save(); toast('学完啦，+3 星'); back(); }
    };
  }
};
function replace(route, params){
  const top = stack.pop(); top.el.remove();

SCREENS['quiz'] = {
  render(p){
    const B = QB[p.m];
    return page({ head:'<header class="nav"><button class="back" data-back>' + ic('close') + '</button><div class="qtop grow" style="margin-left:6px"><div class="pbar"><i data-pg style="width:0"></i></div><span data-n></span></div></header>',
      body:'<div data-area></div>', foot:'<button class="btn" data-act disabled>选择一个答案</button>' });
  },
  mount(el, p){
    const B = QB[p.m], area = $('[data-area]', el), act = $('[data-act]', el); let i = 0, right = 0, answered = false;
    const kindName = { choice:'选择题', listen:'听音选词', spell:'拼写', speak:'跟读' };
    const draw = () => {
      const q = B.qs[i]; answered = false;
      $('[data-pg]', el).style.width = (i / B.qs.length * 100) + '%'; $('[data-n]', el).textContent = (i + 1) + '/' + B.qs.length;
      let h = '<div class="qcard"><span class="kind">' + B.kind + ' · ' + kindName[q.type] + '</span>';
      if(q.type === 'choice') h += q.word ? '<div class="word">' + q.q + '</div><button class="spk sm" data-say="' + q.q + '">' + ic('vol') + '</button><div class="ph mt8">选出正确的意思</div>'
                                          : '<div class="qtext">' + esc(q.q).replace(/\n/g, '<br>') + '</div>';
      if(q.type === 'listen') h += '<button class="spk" data-say="' + q.w + '">' + ic('vol') + '</button><div class="ph">点喇叭听发音，选出听到的单词</div>';
      if(q.type === 'spell') h += '<div class="qtext">「' + q.zh + '」用英语怎么拼？</div><button class="spk sm" data-say="' + q.w + '">' + ic('vol') + '</button>';
      if(q.type === 'speak') h += '<div class="qtext" style="font-size:22px">' + q.w + '</div><button class="spk sm" data-say="' + q.w + '">' + ic('vol') + '</button><div class="ph mt8">先听一遍，再大声读出来</div>';
      h += '</div>';
      if(q.o) h += '<div class="opts">' + q.o.map((o, k) => '<button class="opt" data-k="' + k + '"><i>' + 'ABCD'[k] + '</i>' + o + '</button>').join('') + '</div>';
      if(q.type === 'spell') h += '<input class="spell" data-sp autocomplete="off" autocapitalize="off" placeholder="在这里输入">';
      if(q.type === 'speak') h += '<button class="mic" data-mic>' + ic('mic') + '</button><div class="muted" style="text-align:center" data-mt>点麦克风开始读</div>';
      area.innerHTML = h;
      act.disabled = q.type !== 'spell'; act.textContent = q.type === 'spell' ? '检查' : q.type === 'speak' ? '读完再继续' : '选择一个答案';
      if(q.type === 'speak') act.disabled = true;
      if(q.type === 'listen') setTimeout(() => say(q.w), 300);
    };
    const judge = ok => {
      answered = true; if(ok) right++;
      const q = B.qs[i];
      area.insertAdjacentHTML('beforeend', '<div class="fb ' + (ok ? 'ok' : 'bad') + '">' + ic(ok ? 'check' : 'close') +
        (ok ? ['太棒了！','答对啦！','完全正确！'][i % 3] : '正确答案：' + (q.o ? q.o[q.a] : q.w)) + '</div>');
      act.disabled = false; act.textContent = i < B.qs.length - 1 ? '继续' : '查看结果';
    };
    area.addEventListener('click', e => {
      const s = e.target.closest('[data-say]'); if(s){ say(s.dataset.say); return; }
      const o = e.target.closest('.opt'); const q = B.qs[i];
      if(o && !answered){ const ok = +o.dataset.k === q.a; o.classList.add(ok ? 'ok' : 'bad'); if(!ok) $$('.opt', area)[q.a].classList.add('ok'); judge(ok); }
      const m = e.target.closest('[data-mic]');
      if(m && !answered){ m.classList.add('rec'); $('[data-mt]', area).textContent = '正在听…'; say(q.w);
        setTimeout(() => { m.classList.remove('rec'); $('[data-mt]', area).textContent = '发音评分：★★★★☆'; judge(true); }, 1600); }
    });
    act.onclick = () => {
      const q = B.qs[i];
      if(!answered && q.type === 'spell'){ const v = ($('[data-sp]', area).value || '').trim().toLowerCase(); if(!v) return toast('先拼一拼吧');
        const ok = v === q.w; $('[data-sp]', area).style.boxShadow = 'inset 0 0 0 2px ' + (ok ? 'var(--green)' : 'var(--red)'); judge(ok); return; }
      if(!answered) return;
      if(i < B.qs.length - 1){ i++; draw(); return; }
      replace('result', { m:p.m, r:right, n:B.qs.length, k:p.k });
    };
    draw();
  }
};

];
const TAB_OF = { learn:'learn', lesson:'learn', checkin:'learn', ai:'learn', course:'course', cdetail:'course', lib:'course', review:'review', wordbank:'review', me:'me', report:'me', works:'me', shop:'me', plan:'me', parent:'me', settings:'me' };
function jump(key){
  const [r, m] = key.split(':');
  if(['auth','ob-gender','ob-grade','ob-pref'].includes(r)){ root(r); return; }
  S.logged = true; save();
  const params = { lesson:{ f:todayForm(), src:'today' }, cdetail:{ k:'small' }, lib:{ f:'song' } }[r] || {};
  if(m) params.m = m;
  if(r === 'result'){ params.r = 3; params.n = 4; }
  const t = TAB_OF[r] || ({ clear:'learn', test:'learn', checkin:'learn', after:'course' }[m]) || (r === 'quiz' || r === 'result' ? 'review' : 'learn');
  root(t);
  if(r !== t) mountScreen(r, params, '');
  $('.side').classList.remove('open');
}

function fit(){
  const s = innerWidth > 760 ? Math.min(1, (innerHeight - 24) / 864) : 1;
  $$('.device,.side').forEach(e => { e.style.transform = s < 1 ? 'scale(' + s + ')' : ''; });
  $('.shell').style.gap = (40 * s) + 'px';
}
addEventListener('resize', fit); fit();
